name: CI

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "demo.gif"
      - "LICENSE"
      - ".gitignore"
      - "website/**"

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Parser matches grammar
        # arithmetic-parser.js is generated from arithmetic.pegjs and committed; fail if the
        # grammar changed without regenerating it (pnpm build:parser).
        run: pnpm build:parser && git diff --exit-code packages/engine/src/parser/arithmetic-parser.js

      - name: Test
        run: pnpm test:coverage

  e2e:
    name: E2E
    # macOS: the suite drives the real app, including the OS-wide global shortcut, and is
    # developed and verified on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build

      - name: E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
